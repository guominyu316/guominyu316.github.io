<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">首页</a></li>
        <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        <li><a href="{{ '/notes.html' | relative_url }}">笔记</a></li>
      </ul>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

  <footer class="footer">
    Thanks for stopping by! 😁
  </footer>

  <!-- ===== 右下角悬浮播放器 ===== -->
  <div id="bg-player">
    <button id="bg-play-btn" title="播放/暂停">▶</button>
  </div>

  <audio id="bg-music" loop preload="auto">
    <source src="{{ '/assets/audio/qing-shen-hai-geng-shen.mp3' | relative_url }}" type="audio/mpeg">
  </audio>

  <style>
    #bg-player {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 999;
    }
    #bg-play-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: none;
      background: rgba(58, 110, 165, .9);
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(0, 0, 0, .3);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all .25s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #bg-play-btn:hover {
      background: rgba(74, 126, 181, 1);
      transform: scale(1.08);
    }
    #bg-play-btn:active {
      transform: scale(0.95);
    }
  </style>

  <script>
    (function(){
      var audio = document.getElementById('bg-music');
      var btn = document.getElementById('bg-play-btn');
      audio.volume = 1.0;

      // 播放结束自动重头（双保险）
      audio.addEventListener('ended', function(){
        audio.currentTime = 0;
        audio.play().catch(function(){});
      });

      btn.addEventListener('click', function(){
        if (audio.paused) {
          audio.play().catch(function(){});
        } else {
          audio.pause();
        }
      });

      audio.addEventListener('play', function(){ btn.textContent = '⏸'; });
      audio.addEventListener('pause', function(){ btn.textContent = '▶'; });
    })();
  </script>

</body>
</html>
