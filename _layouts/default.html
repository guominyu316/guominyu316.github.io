<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@callmebill/lxgw-wenkai-web@latest/style.css" />
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- 阅读进度条 -->
  <div id="progress-bar"></div>

  <nav class="navbar">
    <div class="nav-inner">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">首页</a></li>
        <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        <li><a href="{{ '/notes.html' | relative_url }}">笔记</a></li>
      </ul>
      <button id="theme-toggle" title="切换深色模式">🌙</button>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

  <footer class="footer">
    Thanks for stopping by! 😁
  </footer>

  <!-- 返回顶部 -->
  <button id="back-to-top" title="返回顶部">↑</button>

  <style>
    /* 主题切换按钮 */
    #theme-toggle {
      margin-left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .5);
      background: rgba(255, 255, 255, .25);
      color: #1e3c72;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .25s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    #theme-toggle:hover {
      background: rgba(255, 255, 255, .4);
      transform: scale(1.08);
    }

    /* 返回顶部按钮（右下角） */
    #back-to-top {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(58, 110, 165, .85);
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 16px rgba(60, 100, 170, .25);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all .25s;
    }
    #back-to-top:hover {
      background: rgba(74, 126, 181, 1);
      transform: scale(1.1);
    }
    #back-to-top.show {
      display: flex;
    }
  </style>

  <script>
    (function(){
      // 阅读进度条
      window.addEventListener('scroll', function(){
        var h = document.documentElement.scrollHeight - window.innerHeight;
        var p = h > 0 ? (window.scrollY / h) * 100 : 0;
        document.getElementById('progress-bar').style.width = p + '%';
      });

      // 返回顶部
      var backBtn = document.getElementById('back-to-top');
      window.addEventListener('scroll', function(){
        if (window.scrollY > 300) {
          backBtn.classList.add('show');
        } else {
          backBtn.classList.remove('show');
        }
      });
      backBtn.addEventListener('click', function(){
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 深色模式切换
      var themeBtn = document.getElementById('theme-toggle');
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('dark-mode');
        themeBtn.textContent = '☀️';
      }
      themeBtn.addEventListener('click', function(){
        document.body.classList.toggle('dark-mode');
        var isDark = document.body.classList.contains('dark-mode');
        themeBtn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    })();
  </script>

</body>
</html>
