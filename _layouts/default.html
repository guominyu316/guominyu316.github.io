<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <nav class="navbar">
    <div class="nav-inner">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">首页</a></li>
        <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        <li><a href="{{ '/notes.html' | relative_url }}">笔记</a></li>
      </ul>
    </div>
  </nav>

  <main class="content">
    {{ content }}
  </main>

  <footer class="footer">
    Thanks for stopping by! 😁
  </footer>

  <!-- ===== 右下角悬浮播放器 ===== -->
  <div id="bg-player">
    <div id="bg-song-name">未播放</div>
    <div id="bg-controls">
      <button id="bg-prev-btn" title="上一首">⏮</button>
      <button id="bg-play-btn" title="播放/暂停">▶</button>
      <button id="bg-next-btn" title="下一首">⏭</button>
    </div>
    <input type="range" id="bg-volume" min="0" max="1" step="0.01" value="1">
  </div>

  <audio id="bg-music" preload="auto"></audio>

  <style>
    #bg-player {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 999;
      background: rgba(255, 255, 255, .25);
      backdrop-filter: blur(14px) saturate(160%);
      -webkit-backdrop-filter: blur(14px) saturate(160%);
      border: 1px solid rgba(255, 255, 255, .5);
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 4px 16px rgba(60, 100, 170, .18);
      text-align: center;
      width: 150px;
    }
    #bg-song-name {
      font-size: 11px;
      color: #1e3c72;
      margin-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    #bg-controls {
      display: flex;
      gap: 6px;
      justify-content: center;
      margin-bottom: 6px;
    }
    #bg-controls button {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: none;
      background: rgba(58, 110, 165, .9);
      color: #fff;
      font-size: 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      padding: 0;
    }
    #bg-controls button:hover {
      background: rgba(74, 126, 181, 1);
      transform: scale(1.1);
    }
    #bg-controls button:active {
      transform: scale(0.95);
    }
    #bg-volume {
      width: 100%;
      height: 3px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(58, 110, 165, .3);
      border-radius: 3px;
      outline: none;
      cursor: pointer;
    }
    #bg-volume::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3a6ea5;
      cursor: pointer;
    }
    #bg-volume::-moz-range-thumb {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #3a6ea5;
      border: none;
      cursor: pointer;
    }
  </style>

  <script>
    (function(){
      var audio = document.getElementById('bg-music');
      var btn = document.getElementById('bg-play-btn');
      var prevBtn = document.getElementById('bg-prev-btn');
      var nextBtn = document.getElementById('bg-next-btn');
      var nameEl = document.getElementById('bg-song-name');
      var volumeEl = document.getElementById('bg-volume');
      audio.volume = 1.0;

      // ===== 播放列表：歌名 + 文件路径 =====
      var playlist = [
        { name: "情深海更深 - 黎姿",   src: "{{ '/assets/audio/001.mp3' | relative_url }}" },
        { name: "痴心换情深 - 周慧敏", src: "{{ '/assets/audio/002.mp3' | relative_url }}" },
        { name: "风雨爱人 - 李翊君",   src: "{{ '/assets/audio/003.mp3' | relative_url }}" }
      ];
      var current = 0;

      function loadSong(index) {
        current = (index + playlist.length) % playlist.length;
        audio.src = playlist[current].src;
        nameEl.textContent = playlist[current].name;
      }

      loadSong(0);

      audio.addEventListener('ended', function(){
        loadSong(current + 1);
        audio.play().catch(function(){});
      });

      btn.addEventListener('click', function(){
        if (audio.paused) {
          audio.play().catch(function(){});
        } else {
          audio.pause();
        }
      });

      prevBtn.addEventListener('click', function(){
        loadSong(current - 1);
        audio.play().catch(function(){});
      });

      nextBtn.addEventListener('click', function(){
        loadSong(current + 1);
        audio.play().catch(function(){});
      });

      volumeEl.addEventListener('input', function(){
        audio.volume = volumeEl.value;
      });

      audio.addEventListener('play', function(){ btn.textContent = '⏸'; });
      audio.addEventListener('pause', function(){ btn.textContent = '▶'; });
    })();
  </script>

</body>
</html>
