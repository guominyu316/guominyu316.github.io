<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}</title>
  <link rel="icon" href="{{ '/assets/images/favicon.png' | relative_url }}" type="image/png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>

  <!-- 阅读进度条 -->
  <div id="progress-bar"></div>

  <nav class="navbar">
    <div class="nav-inner">
      <ul class="nav-links">
        <li><a href="{{ '/' | relative_url }}">首页</a></li>
        <li><a href="{{ '/about.html' | relative_url }}">关于我</a></li>
        <li><a href="{{ '/notes.html' | relative_url }}">笔记</a></li>
      </ul>
      <button id="theme-toggle" title="切换深色模式">🌙</button>
    </div>
  </nav>

  <main class="content">
    {{ content }}

    {% if page.previous or page.next %}
    <nav class="post-nav">
      {% if page.previous %}
        <a href="{{ page.previous.url | relative_url }}" class="post-nav-prev">
          ← {{ page.previous.title }}
        </a>
      {% else %}
        <span></span>
      {% endif %}
      {% if page.next %}
        <a href="{{ page.next.url | relative_url }}" class="post-nav-next">
          {{ page.next.title }} →
        </a>
      {% endif %}
    </nav>
    {% endif %}
  </main>

  <footer class="footer">
    Thanks for stopping by! 😁
  </footer>

  <style>
    /* 主题切换按钮 */
    #theme-toggle {
      margin-left: 10px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, .5);
      background: rgba(255, 255, 255, .25);
      color: #1e3c72;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .25s;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      flex-shrink: 0;
    }
    #theme-toggle:hover {
      background: rgba(255, 255, 255, .4);
      transform: scale(1.08);
    }
  </style>

  <script>
    (function(){
      // 阅读进度条
      window.addEventListener('scroll', function(){
        var h = document.documentElement.scrollHeight - window.innerHeight;
        var p = h > 0 ? (window.scrollY / h) * 100 : 0;
        document.getElementById('progress-bar').style.width = p + '%';
      });

      // 深色模式切换
      var themeBtn = document.getElementById('theme-toggle');
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.body.classList.add('dark-mode');
        themeBtn.textContent = '☀️';
      }
      themeBtn.addEventListener('click', function(){
        document.body.classList.toggle('dark-mode');
        var isDark = document.body.classList.contains('dark-mode');
        themeBtn.textContent = isDark ? '☀️' : '🌙';
        localStorage.setItem('theme', isDark ? 'dark' : 'light');
      });
    })();
  </script>

</body>
</html>
