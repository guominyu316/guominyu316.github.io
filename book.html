<h1>电子书</h1>

<select id="book-select">
  <option value="/assets/docs/book1.pdf">白蛇全传</option>
  <option value="/assets/docs/book2.pdf">第二本书</option>
  <option value="/assets/docs/book3.pdf">第三本书</option>
  <option value="/assets/docs/book4.pdf">第四本书</option>
  <option value="/assets/docs/book5.pdf">第五本书</option>
  <option value="/assets/docs/book6.pdf">第六本书</option>
  <option value="/assets/docs/book7.pdf">第七本书</option>
  <option value="/assets/docs/book8.pdf">第八本书</option>
  <option value="/assets/docs/book9.pdf">第九本书</option>
  <option value="/assets/docs/book10.pdf">第十本书</option>
</select>

<iframe
  id="pdf-viewer"
  src="{{ '/pdfjs/web/viewer.html?file=/assets/docs/book1.pdf&cMapUrl=/pdfjs/cmaps/&standardFontDataUrl=/pdfjs/standard_fonts/' | relative_url }}"
  style="border: none; border-radius: 12px; width: 100%; height: 80vh;">
</iframe>

<style>
  #book-select {
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 15px;
    border: 2px solid rgba(100, 160, 220, .35);
    background: rgba(100, 160, 220, .12);
    color: #1e3c72;
    cursor: pointer;
    outline: none;
    transition: all .25s;
    width: 100%;
    max-width: 400px;
  }
  #book-select:hover {
    border-color: rgba(100, 160, 220, .7);
    background: rgba(100, 160, 220, .2);
  }
  body.dark-mode #book-select {
    background: rgba(100, 160, 220, .2);
    color: #a8c8f0;
    border-color: rgba(100, 160, 220, .4);
  }
</style>

<script>
  document.getElementById('book-select').addEventListener('change', function(){
    var file = this.value;
    var base = '{{ "/pdfjs/web/viewer.html" | relative_url }}';
    var url = base + '?file=' + file + '&cMapUrl=/pdfjs/cmaps/&standardFontDataUrl=/pdfjs/standard_fonts/';
    document.getElementById('pdf-viewer').src = url;
  });
</script>
